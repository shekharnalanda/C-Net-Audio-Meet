services:
  livekit:
    image: livekit/livekit-server@sha256:e37d68f172556d02aa77968b9fc55ef481468c0315fa38e4fa6c56ce72e3a815
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
volumes:
  redis-data:
